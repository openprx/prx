# cargo-deny configuration — OpenPRX standard v2
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true
exclude-dev = false

[output]
feature-depth = 1

# ===== 安全漏洞 =====
[advisories]
yanked = "deny"
unmaintained = "all"
unsound = "workspace"
# Legacy bincode exception retains its original review date: 2026-06-01
ignore = [
    # bincode v2.0.1 via probe-rs — project ceased but 1.3.3 considered complete
    { id = "RUSTSEC-2025-0141", reason = "bincode: probe-rs transitive dep, project considered complete" },
    # Proposed 2026-10-21; manually review/remove by 2026-11-21.
    # cargo-deny 0.20.2 has no per-advisory expiry. Only the 0.26.11 bridge is
    # reached through tokio-tungstenite 0.28.0 (directly and through Axum).
    # Its only exported roots are parent::TLS_SERVER_ROOTS, resolved to the
    # patched webpki-roots 1.0.10; it contains no independent certificate set.
    # Released tokio-tungstenite 0.29/0.30 still require the 0.26 bridge, so
    # upgrading cannot remove it. Keep the existing Mozilla-root TLS behavior.
    # Bans below reject every other affected version despite this exception.
    { id = "RUSTSEC-2026-0381", reason = "2026-10-21: webpki-roots 0.26.11 only re-exports the patched 1.0.10 root bundle; no distrusted emSign roots remain on this path. Review by 2026-11-21 or when upstream drops the bridge." },
]

# ===== 许可证合规 =====
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OpenSSL",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
]
confidence-threshold = 0.8
include-dev = false
include-build = true
unused-allowed-license = "allow"

[licenses.private]
ignore = true

# ===== 依赖禁用 =====
[bans]
multiple-versions = "warn"
wildcards = "warn"
allow-wildcard-paths = true
allow-workspace = true
highlight = "all"

deny = [
    { crate = "openssl", reason = "Use rustls-tls instead", use-instead = "rustls" },
    { crate = "openssl-sys", reason = "Use rustls-tls instead" },
    # Scope the advisory exception above to the verified 0.26.11 bridge.
    { crate = "webpki-roots:<0.26.11", reason = "Only the verified 0.26.11 bridge may precede the patched 1.0.10 roots" },
    { crate = "webpki-roots:>0.26.11, <1.0.10", reason = "Require the patched 1.0.10 root bundle outside the verified 0.26.11 bridge" },
]

[[bans.features]]
crate = "reqwest"
deny = ["native-tls", "native-tls-vendored"]

[bans.workspace-dependencies]
duplicates = "warn"
unused = "warn"

# ===== 来源可信 =====
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = [
    "https://github.com/rust-lang/crates.io-index",
]
allow-git = []
