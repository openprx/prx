name: Sec Audit

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "crates/**"
      - "deny.toml"
      - "rust-toolchain.toml"
      - '.cargo/audit.toml'
      - '.github/workflows/sec-audit.yml'
  pull_request:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "crates/**"
      - "deny.toml"
      - "rust-toolchain.toml"
      - '.cargo/audit.toml'
      - '.github/workflows/sec-audit.yml'
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: 1.99.0
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit locked dependencies
        run: cargo audit

  deny:
    name: License & Supply Chain
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      matrix:
        checks:
          - advisories
          - bans licenses sources
    # S5 P0-4: advisories 分支移除 continue-on-error，发布门真正阻断
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check ${{ matrix.checks }}
          arguments: --all-features

  miri:
    name: Miri UB Smoke
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # nightly
        with:
          toolchain: nightly
          components: miri
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      # `cargo miri test --lib` over the whole library cannot pass, and never
      # could. `ring` resolves its CPU feature flags through the foreign
      # function `OPENSSL_cpuid_setup` before it runs any primitive, and Miri
      # refuses foreign calls ("unsupported operation: can't call foreign
      # function `ring_core_0_17_14__OPENSSL_cpuid_setup` on OS `linux`"),
      # which aborts the whole test binary at the first test that touches
      # crypto. That is not one stray test: `ring` sits on the witness-keyring
      # path (`acl::approval_grant`, `gateway::compat`), the session-worker
      # HMAC (`session_worker::runner`, `tools::sessions_spawn`), the GLM
      # signer (`providers::glm`) and the rustls provider (`channels::irc`,
      # `nodes::server`). The library also carries ~6.7k unit tests, a large
      # share of them async, filesystem- or network-bound, which neither fit
      # Miri's isolation model nor a 45-minute budget.
      #
      # The job therefore runs an explicit allowlist of pure-computation
      # modules: no FFI, no clock, no filesystem, no tokio. A module may only
      # be added here if it holds to that.
      #
      # Keep the list small for a second reason: Miri's cost here is dominated
      # by interpreter start-up over this test binary (measured locally: 300s
      # wall clock total, 118s of it tests, so about 3 minutes before the first
      # test runs), not by the tests themselves, so the 45-minute budget
      # buys only a handful of modules. `tools::schema` was evaluated and left
      # out -- its reference-expansion-budget tests did not finish inside a
      # 15-minute local run.
      #
      # Known gap: this smoke covers no `unsafe` block. Every `unsafe` site in
      # the library is out of Miri's reach today -- `daemon` (libc socket
      # sendto) and `tools::gateway` (libc kill) are FFI; `config::schema` and
      # `session_worker::runner` only wrap `env::set_var`/`remove_var`, and
      # their covering tests are filesystem-bound or reach `ring::hmac`. The
      # allowlist is a Stacked-Borrows and strict-provenance smoke over safe
      # code, not `unsafe` coverage. Revisit if the crypto backend gains a
      # pure-Rust path or the env-var helpers gain isolation-free tests.
      - name: Run cargo miri smoke
        run: |
          MIRIFLAGS="-Zmiri-strict-provenance" cargo +nightly miri test --lib -- \
            agent::stream_buffer:: \
            providers::utf8_stream:: \
            memory::chunker::

  coverage:
    name: Coverage
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --version 0.8.7 --locked
      - name: Run cargo-llvm-cov
        run: cargo llvm-cov --workspace --lcov --output-path coverage.lcov

  mutants:
    name: Mutation Smoke
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      - name: Install cargo-mutants
        run: cargo install cargo-mutants --version 27.1.0 --locked
      - name: List cargo-mutants candidates
        run: cargo mutants --workspace --list

  fuzz:
    name: Fuzz Smoke
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # nightly
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Run cargo-fuzz smoke
        run: cargo +nightly fuzz run parse_tool_call_json -- -max_total_time=60
