name: CI Run

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

concurrency:
    group: ci-${{ github.event.pull_request.number || github.sha }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    CARGO_TERM_COLOR: always

jobs:
    contracts:
        name: Installer and Toolchain Contracts
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
            - name: Verify Rust toolchain alignment
              run: ./scripts/ci/rust_toolchain_sync_gate.sh
            - name: Verify one-click installer contract
              run: ./scripts/ci/installer_contract_gate.sh
            - name: Verify CI gate contracts
              run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'
            - name: Verify source file size limit
              run: python3 scripts/ci/source_size_gate.py

    windows-installer:
        name: Windows Installer Contract
        runs-on: windows-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
            - name: Parse PowerShell installer
              shell: pwsh
              run: |
                  $source = Get-Content -Raw install.ps1
                  [void][scriptblock]::Create($source)
                  Write-Host "PowerShell installer parsed successfully."

    changes:
        name: Detect Change Scope
        runs-on: ubuntu-latest
        outputs:
            docs_only: ${{ steps.scope.outputs.docs_only }}
            docs_changed: ${{ steps.scope.outputs.docs_changed }}
            rust_changed: ${{ steps.scope.outputs.rust_changed }}
            workflow_changed: ${{ steps.scope.outputs.workflow_changed }}
            docs_files: ${{ steps.scope.outputs.docs_files }}
            base_sha: ${{ steps.scope.outputs.base_sha }}
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
              with:
                  fetch-depth: 0

            - name: Detect docs-only changes
              id: scope
              shell: bash
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
              run: ./scripts/ci/detect_change_scope.sh

    lint:
        name: Lint Gate (Format + Clippy + Strict Delta)
        needs: [changes]
        if: needs.changes.outputs.rust_changed == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
              with:
                  fetch-depth: 0
            - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
              with:
                  toolchain: 1.99.0
                  components: rustfmt, clippy
            - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
              with:
                  key: clippy-default
            - name: Format check
              run: cargo fmt --all -- --check
            - name: Clippy, default features (correctness lints deny everywhere, all other lints deny on changed lines)
              env:
                  BASE_SHA: ${{ needs.changes.outputs.base_sha }}
              run: ./scripts/ci/rust_strict_delta_gate.sh
            - name: Install cargo-machete
              run: cargo install cargo-machete --locked
            - name: Run unused dependency gate
              run: cargo machete

    lint-all-features:
        name: Lint Gate (Clippy, all features)
        needs: [changes]
        if: needs.changes.outputs.rust_changed == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
              with:
                  fetch-depth: 0
            - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
              with:
                  toolchain: 1.99.0
                  components: clippy
            - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
              with:
                  key: clippy-all-features
            - name: Clippy, all features
              env:
                  BASE_SHA: ${{ needs.changes.outputs.base_sha }}
                  CLIPPY_CARGO_ARGS: --all-features
              run: ./scripts/ci/rust_strict_delta_gate.sh

    architecture:
        name: Architecture Boundaries
        needs: [changes]
        if: needs.changes.outputs.rust_changed == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        env:
            CARGO_INCREMENTAL: "0"
            CARGO_PROFILE_TEST_DEBUG: "0"
            CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: "true"
            CARGO_PROFILE_TEST_OVERFLOW_CHECKS: "true"
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
            - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
              with:
                  toolchain: 1.99.0
            - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
              with:
                  key: test-archive
                  save-if: false
            - name: Install cargo-nextest
              run: curl -LsSf https://get.nexte.st/0.9.151/linux | tar zxf - -C "${CARGO_HOME:-~/.cargo}/bin"
            - name: Build the architecture_boundaries binary only
              run: cargo nextest archive --locked --all-features --test architecture_boundaries --archive-file arch.tar.zst
            - name: Run architecture_boundaries (guard home, loopback-only network, 60 s per test)
              env:
                  PRX_GUARD_SUBCOMMAND: nextest
              run: python3 scripts/ci/observe_test_gate.py ./scripts/ci/test_home_guard.sh --archive-file arch.tar.zst --workspace-remap "$GITHUB_WORKSPACE" --profile ci --no-fail-fast

    test-build:
        name: Test Build (archive)
        needs: [changes]
        if: needs.changes.outputs.rust_changed == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 20
        outputs:
            sharded: ${{ steps.list.outputs.sharded }}
        # Test binaries are built once, here, and every shard runs a slice of
        # the archive. Debuginfo stays off (full-debug test linking exhausted
        # 16 GiB before); dependencies are optimized by [profile.dev.package."*"].
        env:
            CARGO_INCREMENTAL: "0"
            CARGO_PROFILE_TEST_DEBUG: "0"
            CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: "true"
            CARGO_PROFILE_TEST_OVERFLOW_CHECKS: "true"
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
            - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
              with:
                  toolchain: 1.99.0
            - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
              with:
                  key: test-archive
            - name: Install cargo-nextest
              run: curl -LsSf https://get.nexte.st/0.9.151/linux | tar zxf - -C "${CARGO_HOME:-~/.cargo}/bin"
            - name: Build the test archive
              run: cargo nextest archive --locked --all-features --archive-file prx-tests.tar.zst
            - name: List every test (the sharded runs must add up to this)
              id: list
              run: |
                  set -euo pipefail
                  cargo nextest list --locked --all-features --archive-file prx-tests.tar.zst --workspace-remap "$GITHUB_WORKSPACE" --message-format json > list.json
                  python3 scripts/ci/nextest_test_count.py list.json | tee count.txt
                  echo "sharded=$(sed -n 's/^sharded=//p' count.txt)" >> "$GITHUB_OUTPUT"
            - name: Run doc-tests (guard home, loopback-only network)
              run: python3 scripts/ci/observe_test_gate.py ./scripts/ci/test_home_guard.sh --locked --all-features --doc
            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: prx-tests
                  path: prx-tests.tar.zst
                  retention-days: 1
                  compression-level: 0

    test-shard:
        name: Test Shard ${{ matrix.shard }}/6
        needs: [test-build]
        runs-on: ubuntu-latest
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                shard: [1, 2, 3, 4, 5, 6]
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
            - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
              with:
                  toolchain: 1.99.0
            - name: Install cargo-nextest
              run: curl -LsSf https://get.nexte.st/0.9.151/linux | tar zxf - -C "${CARGO_HOME:-~/.cargo}/bin"
            - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4
              with:
                  name: prx-tests
            - name: Run shard ${{ matrix.shard }}/6 (guard home, loopback-only network, 60 s per test)
              env:
                  PRX_GUARD_SUBCOMMAND: nextest
              run: |
                  set -euo pipefail
                  python3 scripts/ci/observe_test_gate.py ./scripts/ci/test_home_guard.sh \
                      --archive-file prx-tests.tar.zst --workspace-remap "$GITHUB_WORKSPACE" \
                      --profile ci --no-fail-fast \
                      -E 'not binary(architecture_boundaries)' \
                      --partition hash:${{ matrix.shard }}/6 2>&1 | tee shard.log
            - name: Executed count must equal the shard's share of `nextest list`
              run: |
                  set -euo pipefail
                  executed="$(sed 's/\x1b\[[0-9;]*m//g' shard.log | sed -nE 's/.*Summary.* ([0-9]+) tests? run.*/\1/p' | tail -1)"
                  cargo nextest list --archive-file prx-tests.tar.zst --workspace-remap "$GITHUB_WORKSPACE" \
                      -E 'not binary(architecture_boundaries)' --partition hash:${{ matrix.shard }}/6 \
                      --message-format json > shard-list.json
                  expected="$(python3 scripts/ci/nextest_test_count.py shard-list.json | sed -n 's/^sharded=//p')"
                  echo "shard ${{ matrix.shard }}/6: executed=$executed listed=$expected"
                  [ "$executed" = "$expected" ]
                  echo "$executed" > executed.txt
            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: executed-${{ matrix.shard }}
                  path: executed.txt
                  retention-days: 1

    test:
        name: Test
        needs: [changes, test-build, test-shard, architecture]
        if: always() && needs.changes.outputs.rust_changed == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Every job must have passed
              run: |
                  echo "build=${{ needs.test-build.result }} shards=${{ needs.test-shard.result }} architecture=${{ needs.architecture.result }}"
                  [ "${{ needs.test-build.result }}" = success ] && [ "${{ needs.test-shard.result }}" = success ] && [ "${{ needs.architecture.result }}" = success ]
            - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4
              with:
                  pattern: executed-*
                  merge-multiple: false
                  path: executed
            - name: The shards together ran exactly what nextest lists
              run: |
                  total="$(cat executed/*/executed.txt | paste -sd+ - | bc)"
                  echo "shards executed=$total, nextest list (minus architecture_boundaries)=${{ needs.test-build.outputs.sharded }}"
                  [ "$total" = "${{ needs.test-build.outputs.sharded }}" ]

    mutants:
        name: Mutants (advisory, in diff)
        needs: [changes]
        if: github.event_name == 'pull_request' && needs.changes.outputs.rust_changed == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 12
        # Advisory for the reviewer: never part of the required gate.
        continue-on-error: true
        env:
            CARGO_INCREMENTAL: "0"
            CARGO_PROFILE_TEST_DEBUG: "0"
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
              with:
                  fetch-depth: 0
            - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
              with:
                  toolchain: 1.99.0
            - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
              with:
                  key: mutants
            - name: Install cargo-mutants
              run: cargo install cargo-mutants --locked
            - name: Mutate the diff, 10 minute box
              env:
                  BASE_SHA: ${{ needs.changes.outputs.base_sha }}
              run: |
                  git diff "$BASE_SHA" HEAD -- 'src/**/*.rs' 'src/*.rs' > pr.diff
                  if [ ! -s pr.diff ]; then echo "no Rust source in the diff"; exit 0; fi
                  timeout 540 cargo mutants --in-diff pr.diff --baseline skip --test-tool nextest --jobs 2 --timeout 90 -- --lib --locked || echo "mutants exit $? (advisory)"
                  cat mutants.out/missed.txt 2>/dev/null || true

    build:
        name: Build (Smoke)
        needs: [changes]
        if: needs.changes.outputs.rust_changed == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
            - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
              with:
                  toolchain: 1.99.0
            - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
            - name: Build binary (smoke check)
              run: cargo build --locked --verbose

    bench-check:
        name: Benchmarks (type-check)
        needs: [changes]
        if: needs.changes.outputs.rust_changed == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
            - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
              with:
                  toolchain: 1.99.0
            - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
              with:
                  key: bench-check
            - name: Type-check criterion benchmarks
              run: cargo check --locked --profile ci --bench router_decision --bench prompt_render --bench tool_dispatch

    windows-check:
        name: Windows Check
        needs: [changes]
        if: needs.changes.outputs.rust_changed == 'true'
        runs-on: windows-latest
        timeout-minutes: 35
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
            - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
              with:
                  toolchain: 1.99.0
                  targets: x86_64-pc-windows-msvc
            - name: Install system dependencies
              run: choco install protoc --yes
            - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
              with:
                  key: x86_64-pc-windows-msvc-check
            - name: Check Windows binaries
              run: cargo check --locked --target x86_64-pc-windows-msvc --bin prx --bin prx-node

    docs-only:
        name: Docs-Only Fast Path
        needs: [changes]
        if: needs.changes.outputs.docs_only == 'true'
        runs-on: ubuntu-latest
        steps:
            - name: Skip heavy jobs for docs-only change
              run: echo "Docs-only change detected. Rust lint/test/build skipped."

    non-rust:
        name: Non-Rust Fast Path
        needs: [changes]
        if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.rust_changed != 'true'
        runs-on: ubuntu-latest
        steps:
            - name: Skip Rust jobs for non-Rust change scope
              run: echo "No Rust-impacting files changed. Rust lint/test/build skipped."

    docs-quality:
        name: Docs Quality
        needs: [changes]
        if: needs.changes.outputs.docs_changed == 'true' && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full'))
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
              with:
                  fetch-depth: 0

            - name: Markdown lint (changed lines only)
              env:
                  BASE_SHA: ${{ needs.changes.outputs.base_sha }}
                  DOCS_FILES: ${{ needs.changes.outputs.docs_files }}
              run: ./scripts/ci/docs_quality_gate.sh

            - name: Collect added links
              id: collect_links
              shell: bash
              env:
                  BASE_SHA: ${{ needs.changes.outputs.base_sha }}
                  DOCS_FILES: ${{ needs.changes.outputs.docs_files }}
              run: |
                  set -euo pipefail
                  python3 ./scripts/ci/collect_changed_links.py \
                    --base "$BASE_SHA" \
                    --docs-files "$DOCS_FILES" \
                    --output .ci-added-links.txt
                  count=$(wc -l < .ci-added-links.txt | tr -d ' ')
                  echo "count=$count" >> "$GITHUB_OUTPUT"
                  if [ "$count" -gt 0 ]; then
                    echo "Added links queued for check:"
                    cat .ci-added-links.txt
                  else
                    echo "No added links found in changed docs lines."
                  fi

            - name: Link check (offline, added links only)
              if: steps.collect_links.outputs.count != '0'
              uses: lycheeverse/lychee-action@a8c4c7cb88f0c7386610c35eb25108e448569cb0 # v2
              with:
                  fail: true
                  args: >-
                      --offline
                      --no-progress
                      --format detailed
                      .ci-added-links.txt
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Skip link check (no added links)
              if: steps.collect_links.outputs.count == '0'
              run: echo "No added links in changed docs lines. Link check skipped."

    lint-feedback:
        name: Lint Feedback
        if: github.event_name == 'pull_request'
        needs: [changes, lint, lint-all-features, docs-quality]
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: write
            issues: write
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

            - name: Post actionable lint failure summary
              if: always()
              uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
              env:
                  RUST_CHANGED: ${{ needs.changes.outputs.rust_changed }}
                  DOCS_CHANGED: ${{ needs.changes.outputs.docs_changed }}
                  LINT_RESULT: ${{ needs.lint.result }}
                  LINT_DELTA_RESULT: ${{ needs.lint-all-features.result }}
                  DOCS_RESULT: ${{ needs.docs-quality.result }}
              with:
                  script: |
                      const script = require('./.github/workflows/scripts/lint_feedback.js');
                      await script({github, context, core});

    workflow-owner-approval:
        name: Workflow Owner Approval
        needs: [changes]
        if: github.event_name == 'pull_request' && needs.changes.outputs.workflow_changed == 'true'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: read
        steps:
            - name: Checkout repository
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

            - name: Require owner approval for workflow file changes
              uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
              env:
                  WORKFLOW_OWNER_LOGINS: ${{ vars.WORKFLOW_OWNER_LOGINS }}
              with:
                  script: |
                    const script = require('./.github/workflows/scripts/ci_workflow_owner_approval.js');
                    await script({ github, context, core });
    ci-required:
        name: CI Required Gate
        if: always()
        needs: [contracts, windows-installer, changes, lint, lint-all-features, test, build, bench-check, windows-check, docs-only, non-rust, docs-quality, lint-feedback, workflow-owner-approval]
        runs-on: ubuntu-latest
        steps:
            - name: Enforce required status
              shell: bash
              run: |
                  set -euo pipefail

                  if [ "${{ needs.contracts.result }}" != "success" ] || [ "${{ needs.windows-installer.result }}" != "success" ]; then
                    echo "Contracts did not pass."
                    exit 1
                  fi

                  event_name="${{ github.event_name }}"
                  rust_changed="${{ needs.changes.outputs.rust_changed }}"
                  docs_changed="${{ needs.changes.outputs.docs_changed }}"
                  workflow_changed="${{ needs.changes.outputs.workflow_changed }}"
                  docs_result="${{ needs.docs-quality.result }}"
                  workflow_owner_result="${{ needs.workflow-owner-approval.result }}"

                  if [ "${{ needs.changes.outputs.docs_only }}" = "true" ]; then
                    echo "workflow_owner_approval=${workflow_owner_result}"
                    if [ "$event_name" = "pull_request" ] && [ "$workflow_changed" = "true" ] && [ "$workflow_owner_result" != "success" ]; then
                      echo "Workflow files changed but workflow owner approval gate did not pass."
                      exit 1
                    fi
                    if [ "$event_name" != "pull_request" ] && [ "$docs_changed" = "true" ] && [ "$docs_result" != "success" ]; then
                      echo "Docs-only push changed docs, but docs-quality did not pass."
                      exit 1
                    fi
                    echo "Docs-only fast path passed."
                    exit 0
                  fi

                  if [ "$rust_changed" != "true" ]; then
                    echo "rust_changed=false (non-rust fast path)"
                    echo "workflow_owner_approval=${workflow_owner_result}"
                    if [ "$event_name" = "pull_request" ] && [ "$workflow_changed" = "true" ] && [ "$workflow_owner_result" != "success" ]; then
                      echo "Workflow files changed but workflow owner approval gate did not pass."
                      exit 1
                    fi
                    if [ "$event_name" != "pull_request" ] && [ "$docs_changed" = "true" ] && [ "$docs_result" != "success" ]; then
                      echo "Non-rust push changed docs, but docs-quality did not pass."
                      exit 1
                    fi
                    echo "Non-rust fast path passed."
                    exit 0
                  fi

                  lint_result="${{ needs.lint.result }}"
                  lint_strict_delta_result="${{ needs.lint-all-features.result }}"
                  test_result="${{ needs.test.result }}"
                  build_result="${{ needs.build.result }}"
                  windows_check_result="${{ needs.windows-check.result }}"

                  echo "lint=${lint_result}"
                  echo "lint_strict_delta=${lint_strict_delta_result}"
                  echo "test=${test_result}"
                  echo "build=${build_result}"
                  echo "windows_check=${windows_check_result}"
                  echo "docs=${docs_result}"
                  echo "workflow_owner_approval=${workflow_owner_result}"

                  if [ "$event_name" = "pull_request" ] && [ "$workflow_changed" = "true" ] && [ "$workflow_owner_result" != "success" ]; then
                    echo "Workflow files changed but workflow owner approval gate did not pass."
                    exit 1
                  fi

                  if [ "$event_name" = "pull_request" ]; then
                    if [ "$lint_result" != "success" ] || [ "$lint_strict_delta_result" != "success" ] || [ "$test_result" != "success" ] || [ "$build_result" != "success" ] || [ "${{ needs.bench-check.result }}" != "success" ] || [ "$windows_check_result" != "success" ]; then
                      echo "Required PR CI jobs did not pass."
                      exit 1
                    fi
                    echo "PR required checks passed."
                    exit 0
                  fi

                  if [ "$lint_result" != "success" ] || [ "$lint_strict_delta_result" != "success" ] || [ "$test_result" != "success" ] || [ "$build_result" != "success" ] || [ "${{ needs.bench-check.result }}" != "success" ] || [ "$windows_check_result" != "success" ]; then
                    echo "Required push CI jobs did not pass."
                    exit 1
                  fi

                  if [ "$docs_changed" = "true" ] && [ "$docs_result" != "success" ]; then
                    echo "Push changed docs, but docs-quality did not pass."
                    exit 1
                  fi

                  echo "Push required checks passed."
