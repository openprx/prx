name: CI Run

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:
        inputs:
            runner:
                description: Force GitHub-hosted heavy jobs (manual runs always use GitHub)
                type: choice
                options: [github]
                default: github

concurrency:
    group: ci-${{ github.event.pull_request.number || github.sha }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    CARGO_TERM_COLOR: always

jobs:
    contracts:
        name: Installer and Toolchain Contracts
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
            - name: Verify Rust toolchain alignment
              run: ./scripts/ci/rust_toolchain_sync_gate.sh
            - name: Verify one-click installer contract
              run: ./scripts/ci/installer_contract_gate.sh
            - name: Verify CI gate contracts
              run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'
            - name: Verify source file size limit
              run: python3 scripts/ci/source_size_gate.py

    windows-installer:
        name: Windows Installer Contract
        runs-on: windows-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
            - name: Parse PowerShell installer
              shell: pwsh
              run: |
                  $source = Get-Content -Raw install.ps1
                  [void][scriptblock]::Create($source)
                  Write-Host "PowerShell installer parsed successfully."

    changes:
        name: Detect Change Scope
        runs-on: ubuntu-latest
        outputs:
            heavy_runner: ${{ steps.runner.outputs.heavy_runner }}
            heavy_timeout: ${{ steps.runner.outputs.heavy_timeout }}
            docs_only: ${{ steps.scope.outputs.docs_only }}
            docs_changed: ${{ steps.scope.outputs.docs_changed }}
            rust_changed: ${{ steps.scope.outputs.rust_changed }}
            workflow_changed: ${{ steps.scope.outputs.workflow_changed }}
            docs_files: ${{ steps.scope.outputs.docs_files }}
            base_sha: ${{ steps.scope.outputs.base_sha }}
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
              with:
                  fetch-depth: 0

            # Only main pushes and same-repo PRs may use the sandboxed QA pool.
            # All other events use GitHub; variable/manual overrides force GitHub.
            # Jobs selecting this pool must never reference secrets.*; enforced
            # by scripts/ci/test_fastci_runner.py, including inherited workflow env.
            - name: Select heavy job runner
              id: runner
              env:
                  HEAVY_RUNNER: ${{ (vars.PRX_CI_RUNNER == 'github' || inputs.runner == 'github') && '"ubuntu-latest"' || ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && '["self-hosted","linux","x64","prx-qa-sandboxed"]' || '"ubuntu-latest"' }}
              run: |
                  echo "heavy_runner=$HEAVY_RUNNER" >> "$GITHUB_OUTPUT"
                  if [ "$HEAVY_RUNNER" = '"ubuntu-latest"' ]; then
                      echo "heavy_timeout=45" >> "$GITHUB_OUTPUT"
                  else
                      echo "heavy_timeout=15" >> "$GITHUB_OUTPUT"
                  fi

            - name: Detect docs-only changes
              id: scope
              shell: bash
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
              run: ./scripts/ci/detect_change_scope.sh

    lint:
        name: Lint Gate (Format + Clippy + Strict Delta)
        needs: [changes]
        if: needs.changes.outputs.rust_changed == 'true'
        runs-on: ${{ fromJSON(needs.changes.outputs.heavy_runner) }}
        # r5 QA cap: measure, then lower (hosted fallback unchanged).
        timeout-minutes: ${{ needs.changes.outputs.heavy_timeout == '45' && 45 || 25 }}
        env:
            CARGO_BUILD_JOBS: "4"
            CARGO_INCREMENTAL: "0"
        steps:
            - name: Configure runner paths
              env:
                  TARGET_DIR: ${{ needs.changes.outputs.heavy_timeout == '45' && format('{0}/target', github.workspace) || format('/srv/ci-runner/target/{0}', github.job) }}
              run: |
                  # Targets may be wiped by the host disk guard; builds recreate them.
                  echo "CARGO_TARGET_DIR=$TARGET_DIR" >> "$GITHUB_ENV"
                  echo "PRX_GUARD_HOME=$RUNNER_TEMP/home" >> "$GITHUB_ENV"
                  if [ "$TARGET_DIR" != "$GITHUB_WORKSPACE/target" ]; then
                      mkdir -p /srv/ci-runner/cache/cargo/bin
                      echo "CARGO_HOME=/srv/ci-runner/cache/cargo" >> "$GITHUB_ENV"
                      echo "/srv/ci-runner/cache/cargo/bin" >> "$GITHUB_PATH"
                  fi
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
              with:
                  fetch-depth: 0
            - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
              with:
                  toolchain: 1.99.0
                  components: rustfmt, clippy
            - if: needs.changes.outputs.heavy_timeout == '45'
              uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
              with:
                  key: clippy-default
            - name: Format check
              run: cargo fmt --all -- --check
            - name: Clippy, default features (correctness lints deny everywhere, all other lints deny on changed lines)
              env:
                  BASE_SHA: ${{ needs.changes.outputs.base_sha }}
              run: ./scripts/ci/rust_strict_delta_gate.sh
            - name: Install cargo-machete
              run: command -v cargo-machete >/dev/null || cargo install cargo-machete --locked
            - name: Run unused dependency gate
              run: cargo machete
            - name: Clean guard home
              if: always()
              run: rm -rf -- "${RUNNER_TEMP:?}/home"

    lint-all-features:
        name: Lint Gate (Clippy, all features)
        needs: [changes]
        if: needs.changes.outputs.rust_changed == 'true'
        runs-on: ${{ fromJSON(needs.changes.outputs.heavy_runner) }}
        # r5 QA cap: measure, then lower (hosted fallback unchanged).
        timeout-minutes: ${{ needs.changes.outputs.heavy_timeout == '45' && 45 || 25 }}
        env:
            CARGO_BUILD_JOBS: "4"
            CARGO_INCREMENTAL: "0"
        steps:
            - name: Configure runner paths
              env:
                  TARGET_DIR: ${{ needs.changes.outputs.heavy_timeout == '45' && format('{0}/target', github.workspace) || format('/srv/ci-runner/target/{0}', github.job) }}
              run: |
                  # Targets may be wiped by the host disk guard; builds recreate them.
                  echo "CARGO_TARGET_DIR=$TARGET_DIR" >> "$GITHUB_ENV"
                  echo "PRX_GUARD_HOME=$RUNNER_TEMP/home" >> "$GITHUB_ENV"
                  if [ "$TARGET_DIR" != "$GITHUB_WORKSPACE/target" ]; then
                      mkdir -p /srv/ci-runner/cache/cargo/bin
                      echo "CARGO_HOME=/srv/ci-runner/cache/cargo" >> "$GITHUB_ENV"
                      echo "/srv/ci-runner/cache/cargo/bin" >> "$GITHUB_PATH"
                  fi
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
              with:
                  fetch-depth: 0
            - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
              with:
                  toolchain: 1.99.0
                  components: clippy
            - if: needs.changes.outputs.heavy_timeout == '45'
              uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
              with:
                  key: clippy-all-features
                  cache-on-failure: true
            - name: Clippy, all features
              env:
                  BASE_SHA: ${{ needs.changes.outputs.base_sha }}
                  CLIPPY_CARGO_ARGS: --all-features
              run: ./scripts/ci/rust_strict_delta_gate.sh
            - name: Clean guard home
              if: always()
              run: rm -rf -- "${RUNNER_TEMP:?}/home"

    architecture:
        name: Architecture Boundaries
        needs: [changes]
        if: needs.changes.outputs.rust_changed == 'true'
        runs-on: ${{ fromJSON(needs.changes.outputs.heavy_runner) }}
        timeout-minutes: ${{ fromJSON(needs.changes.outputs.heavy_timeout) }}
        env:
            CARGO_BUILD_JOBS: "4"
            CARGO_INCREMENTAL: "0"
        steps:
            - name: Configure runner paths
              env:
                  TARGET_DIR: ${{ needs.changes.outputs.heavy_timeout == '45' && format('{0}/target', github.workspace) || format('/srv/ci-runner/target/{0}', github.job) }}
              run: |
                  # Targets may be wiped by the host disk guard; builds recreate them.
                  echo "CARGO_TARGET_DIR=$TARGET_DIR" >> "$GITHUB_ENV"
                  echo "PRX_GUARD_HOME=$RUNNER_TEMP/home" >> "$GITHUB_ENV"
                  if [ "$TARGET_DIR" != "$GITHUB_WORKSPACE/target" ]; then
                      mkdir -p /srv/ci-runner/cache/cargo/bin
                      echo "CARGO_HOME=/srv/ci-runner/cache/cargo" >> "$GITHUB_ENV"
                      echo "/srv/ci-runner/cache/cargo/bin" >> "$GITHUB_PATH"
                  fi
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
            - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
              with:
                  toolchain: 1.99.0
            # 252 source scanners that need no crate code: built on their own,
            # optimized (4 s build, 26 s run; 10 minutes and over 60 s per probe
            # when built unoptimized with the crate). `retired_feature` needs the
            # crate and runs in a test shard.
            - name: Build the architecture_boundaries binary
              run: scripts/ci/build_architecture_boundaries.sh "$PWD/architecture-boundaries"
            - name: Run architecture_boundaries (guard home, loopback-only network, no test over 60 s)
              env:
                  PRX_GUARD_SUBCOMMAND: exec
              run: |
                  set -o pipefail
                  python3 scripts/ci/observe_test_gate.py ./scripts/ci/test_home_guard.sh "$PWD/architecture-boundaries" 2>&1 | tee arch.log
                  if grep -q 'has been running for over 60 seconds' arch.log; then
                      echo "a test exceeded the 60 s budget" >&2
                      exit 1
                  fi
                  sed -nE 's/^test result: ok\. ([0-9]+) passed.*/\1/p' arch.log | tail -1 > executed.txt
                  test -s executed.txt
            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: arch-executed
                  path: executed.txt
                  retention-days: 1

            - name: Clean guard home
              if: always()
              run: rm -rf -- "${RUNNER_TEMP:?}/home"

    # The crate is one huge package: its 10k-test lib test binary is a single
    # rustc that, built next to the other test binaries on a 16 GiB runner, got
    # the job killed (SIGTERM, no message). Two archives are built in parallel
    # instead: `lib` (the lib test binary) and `rest` (bins, integration tests,
    # doc-tests). Debuginfo stays off; dependencies are optimized by
    # [profile.dev.package."*"].
    test-build:
        name: Test Build (${{ matrix.name }})
        needs: [changes]
        if: needs.changes.outputs.rust_changed == 'true'
        runs-on: ${{ fromJSON(needs.changes.outputs.heavy_runner) }}
        # r5 QA cap: measure, then lower (hosted fallback unchanged).
        timeout-minutes: ${{ needs.changes.outputs.heavy_timeout == '45' && 45 || 25 }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: lib
                      targets: --lib
                    - name: rest
                      targets: --bins --tests
        env:
            CARGO_BUILD_JOBS: "4"
            CARGO_INCREMENTAL: "0"
            CARGO_PROFILE_TEST_DEBUG: "0"
            CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: "true"
            CARGO_PROFILE_TEST_OVERFLOW_CHECKS: "true"
        steps:
            - name: Configure runner paths
              env:
                  TARGET_DIR: ${{ needs.changes.outputs.heavy_timeout == '45' && format('{0}/target', github.workspace) || format('/srv/ci-runner/target/{0}{1}', github.job, matrix.name && format('-{0}', matrix.name) || '') }}
              run: |
                  # Targets may be wiped by the host disk guard; builds recreate them.
                  echo "CARGO_TARGET_DIR=$TARGET_DIR" >> "$GITHUB_ENV"
                  echo "PRX_GUARD_HOME=$RUNNER_TEMP/home" >> "$GITHUB_ENV"
                  if [ "$TARGET_DIR" != "$GITHUB_WORKSPACE/target" ]; then
                      mkdir -p /srv/ci-runner/cache/cargo/bin
                      echo "CARGO_HOME=/srv/ci-runner/cache/cargo" >> "$GITHUB_ENV"
                      echo "/srv/ci-runner/cache/cargo/bin" >> "$GITHUB_PATH"
                  fi
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
            - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
              with:
                  toolchain: 1.99.0
            - if: needs.changes.outputs.heavy_timeout == '45'
              uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
              with:
                  shared-key: test-archive-${{ matrix.name }}
                  cache-on-failure: true
            - name: Install cargo-nextest
              run: command -v cargo-nextest >/dev/null || curl -LsSf https://get.nexte.st/0.9.151/linux | tar zxf - -C "${CARGO_HOME:-~/.cargo}/bin"
            - name: Build the test archive
              run: cargo nextest archive --locked --all-features ${{ matrix.targets }} --archive-file prx-tests-${{ matrix.name }}.tar.zst
            - name: List every test (the sharded runs must add up to this)
              run: |
                  set -euo pipefail
                  cargo nextest list --archive-file prx-tests-${{ matrix.name }}.tar.zst --workspace-remap "$GITHUB_WORKSPACE" --message-format json > list.json
                  python3 scripts/ci/nextest_test_count.py list.json | tee count.txt
                  sed -n 's/^sharded=//p' count.txt > sharded.txt
                  sed -n 's/^architecture=//p' count.txt > architecture.txt
            - name: Run doc-tests (guard home, loopback-only network)
              if: matrix.name == 'rest'
              run: python3 scripts/ci/observe_test_gate.py ./scripts/ci/test_home_guard.sh --locked --all-features --doc
            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: prx-tests-${{ matrix.name }}
                  path: prx-tests-${{ matrix.name }}.tar.zst
                  retention-days: 1
                  compression-level: 0
            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: sharded-${{ matrix.name }}
                  path: |
                      sharded.txt
                      architecture.txt
                  retention-days: 1
            - name: Clean guard home
              if: always()
              run: rm -rf -- "${RUNNER_TEMP:?}/home"

    test-shard:
        name: Test Shard ${{ matrix.name }}
        needs: [changes, test-build]
        runs-on: ${{ fromJSON(needs.changes.outputs.heavy_runner) }}
        timeout-minutes: ${{ fromJSON(needs.changes.outputs.heavy_timeout) }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { name: lib-1, archive: lib, part: "1/3" }
                    - { name: lib-2, archive: lib, part: "2/3" }
                    - { name: lib-3, archive: lib, part: "3/3" }
                    - { name: rest-1, archive: rest, part: "1/3" }
                    - { name: rest-2, archive: rest, part: "2/3" }
                    - { name: rest-3, archive: rest, part: "3/3" }
        env:
            CARGO_BUILD_JOBS: "4"
            CARGO_INCREMENTAL: "0"
        steps:
            - name: Configure runner paths
              env:
                  TARGET_DIR: ${{ needs.changes.outputs.heavy_timeout == '45' && format('{0}/target', github.workspace) || format('/srv/ci-runner/target/{0}', github.job) }}
              run: |
                  # Targets may be wiped by the host disk guard; builds recreate them.
                  echo "CARGO_TARGET_DIR=$TARGET_DIR" >> "$GITHUB_ENV"
                  echo "PRX_GUARD_HOME=$RUNNER_TEMP/home" >> "$GITHUB_ENV"
                  if [ "$TARGET_DIR" != "$GITHUB_WORKSPACE/target" ]; then
                      mkdir -p /srv/ci-runner/cache/cargo/bin
                      echo "CARGO_HOME=/srv/ci-runner/cache/cargo" >> "$GITHUB_ENV"
                      echo "/srv/ci-runner/cache/cargo/bin" >> "$GITHUB_PATH"
                  fi
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
            - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
              with:
                  toolchain: 1.99.0
            - name: Install cargo-nextest
              run: command -v cargo-nextest >/dev/null || curl -LsSf https://get.nexte.st/0.9.151/linux | tar zxf - -C "${CARGO_HOME:-~/.cargo}/bin"
            - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4
              with:
                  name: prx-tests-${{ matrix.archive }}
            - name: Run shard ${{ matrix.part }} of ${{ matrix.archive }} (guard home, loopback-only network, 60 s per test)
              env:
                  PRX_GUARD_SUBCOMMAND: nextest
              run: |
                  set -euo pipefail
                  python3 scripts/ci/observe_test_gate.py ./scripts/ci/test_home_guard.sh \
                      --archive-file prx-tests-${{ matrix.archive }}.tar.zst --workspace-remap "$GITHUB_WORKSPACE" \
                      --profile ci --no-fail-fast \
                      -E 'not (binary(architecture_boundaries) and not test(/^retired_feature::/))' \
                      --partition hash:${{ matrix.part }} 2>&1 | tee shard.log
            - name: Executed count must equal the shard's share of `nextest list`
              run: |
                  set -euo pipefail
                  executed="$(sed 's/\x1b\[[0-9;]*m//g' shard.log | sed -nE 's/.*Summary.* ([0-9]+) tests? run.*/\1/p' | tail -1)"
                  cargo nextest list --archive-file prx-tests-${{ matrix.archive }}.tar.zst --workspace-remap "$GITHUB_WORKSPACE" \
                      -E 'not (binary(architecture_boundaries) and not test(/^retired_feature::/))' --partition hash:${{ matrix.part }} \
                      --message-format json > shard-list.json
                  expected="$(python3 scripts/ci/nextest_test_count.py shard-list.json | sed -n 's/^sharded=//p')"
                  echo "shard ${{ matrix.name }} (${{ matrix.part }}): executed=$executed listed=$expected"
                  [ "$executed" = "$expected" ]
                  echo "$executed" > executed.txt
            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: executed-${{ matrix.name }}
                  path: executed.txt
                  retention-days: 1
            - name: Clean guard home
              if: always()
              run: rm -rf -- "${RUNNER_TEMP:?}/home"

    test:
        name: Test
        needs: [changes, test-build, test-shard, architecture]
        if: always() && needs.changes.outputs.rust_changed == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Every job must have passed
              run: |
                  echo "build=${{ needs.test-build.result }} shards=${{ needs.test-shard.result }} architecture=${{ needs.architecture.result }}"
                  [ "${{ needs.test-build.result }}" = success ] && [ "${{ needs.test-shard.result }}" = success ] && [ "${{ needs.architecture.result }}" = success ]
            - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4
              with:
                  pattern: executed-*
                  path: executed
            - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4
              with:
                  pattern: sharded-*
                  path: sharded
            - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4
              with:
                  name: arch-executed
                  path: arch
            - name: The architecture job ran exactly the architecture tests nextest lists
              run: |
                  listed="$(cat sharded/*/architecture.txt | paste -sd+ - | bc)"
                  echo "architecture executed=$(cat arch/executed.txt), listed=$listed"
                  [ "$(cat arch/executed.txt)" = "$listed" ]
            - name: The shards together ran exactly what nextest lists
              run: |
                  executed="$(cat executed/*/executed.txt | paste -sd+ - | bc)"
                  listed="$(cat sharded/*/sharded.txt | paste -sd+ - | bc)"
                  echo "shards executed=$executed, nextest list (minus architecture_boundaries)=$listed"
                  [ "$executed" = "$listed" ]

    mutants:
        name: Mutants (advisory, in diff)
        needs: [changes]
        if: github.event_name == 'pull_request' && needs.changes.outputs.rust_changed == 'true'
        runs-on: ${{ fromJSON(needs.changes.outputs.heavy_runner) }}
        timeout-minutes: ${{ fromJSON(needs.changes.outputs.heavy_timeout) }}
        # Advisory for the reviewer: never part of the required gate.
        continue-on-error: true
        env:
            CARGO_BUILD_JOBS: "4"
            CARGO_INCREMENTAL: "0"
            CARGO_PROFILE_TEST_DEBUG: "0"
        steps:
            - name: Configure runner paths
              env:
                  TARGET_DIR: ${{ needs.changes.outputs.heavy_timeout == '45' && format('{0}/target', github.workspace) || format('/srv/ci-runner/target/{0}', github.job) }}
              run: |
                  # Targets may be wiped by the host disk guard; builds recreate them.
                  echo "CARGO_TARGET_DIR=$TARGET_DIR" >> "$GITHUB_ENV"
                  echo "PRX_GUARD_HOME=$RUNNER_TEMP/home" >> "$GITHUB_ENV"
                  if [ "$TARGET_DIR" != "$GITHUB_WORKSPACE/target" ]; then
                      mkdir -p /srv/ci-runner/cache/cargo/bin
                      echo "CARGO_HOME=/srv/ci-runner/cache/cargo" >> "$GITHUB_ENV"
                      echo "/srv/ci-runner/cache/cargo/bin" >> "$GITHUB_PATH"
                  fi
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
              with:
                  fetch-depth: 0
            - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
              with:
                  toolchain: 1.99.0
            - if: needs.changes.outputs.heavy_timeout == '45'
              uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
              with:
                  key: mutants
            - name: Install cargo-mutants
              run: cargo install cargo-mutants --locked
            - name: Mutate the diff, 10 minute box
              env:
                  BASE_SHA: ${{ needs.changes.outputs.base_sha }}
              run: |
                  git diff "$BASE_SHA" HEAD -- 'src/**/*.rs' 'src/*.rs' > pr.diff
                  if [ ! -s pr.diff ]; then echo "no Rust source in the diff"; exit 0; fi
                  timeout 540 cargo mutants --in-diff pr.diff --baseline skip --test-tool nextest --jobs 2 --timeout 90 -- --lib --locked || echo "mutants exit $? (advisory)"
                  cat mutants.out/missed.txt 2>/dev/null || true
            - name: Clean guard home
              if: always()
              run: rm -rf -- "${RUNNER_TEMP:?}/home"

    build:
        name: Build (Smoke)
        needs: [changes]
        if: needs.changes.outputs.rust_changed == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
            - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
              with:
                  toolchain: 1.99.0
            - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
            - name: Build binary (smoke check)
              run: cargo build --locked --verbose

    bench-check:
        name: Benchmarks (type-check)
        needs: [changes]
        if: needs.changes.outputs.rust_changed == 'true'
        runs-on: ${{ fromJSON(needs.changes.outputs.heavy_runner) }}
        timeout-minutes: ${{ fromJSON(needs.changes.outputs.heavy_timeout) }}

        env:
            CARGO_BUILD_JOBS: "4"
            CARGO_INCREMENTAL: "0"
        steps:
            - name: Configure runner paths
              env:
                  TARGET_DIR: ${{ needs.changes.outputs.heavy_timeout == '45' && format('{0}/target', github.workspace) || format('/srv/ci-runner/target/{0}', github.job) }}
              run: |
                  # Targets may be wiped by the host disk guard; builds recreate them.
                  echo "CARGO_TARGET_DIR=$TARGET_DIR" >> "$GITHUB_ENV"
                  echo "PRX_GUARD_HOME=$RUNNER_TEMP/home" >> "$GITHUB_ENV"
                  if [ "$TARGET_DIR" != "$GITHUB_WORKSPACE/target" ]; then
                      mkdir -p /srv/ci-runner/cache/cargo/bin
                      echo "CARGO_HOME=/srv/ci-runner/cache/cargo" >> "$GITHUB_ENV"
                      echo "/srv/ci-runner/cache/cargo/bin" >> "$GITHUB_PATH"
                  fi
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
            - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
              with:
                  toolchain: 1.99.0
            - if: needs.changes.outputs.heavy_timeout == '45'
              uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
              with:
                  key: bench-check
            - name: Type-check criterion benchmarks
              run: cargo check --locked --profile ci --bench router_decision --bench prompt_render --bench tool_dispatch
            - name: Clean guard home
              if: always()
              run: rm -rf -- "${RUNNER_TEMP:?}/home"

    windows-check:
        name: Windows Check
        needs: [changes]
        if: needs.changes.outputs.rust_changed == 'true'
        runs-on: windows-latest
        timeout-minutes: 35
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
            - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
              with:
                  toolchain: 1.99.0
                  targets: x86_64-pc-windows-msvc
            - name: Install system dependencies
              run: choco install protoc --yes
            - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
              with:
                  key: x86_64-pc-windows-msvc-check
            - name: Check Windows binaries
              run: cargo check --locked --target x86_64-pc-windows-msvc --bin prx --bin prx-node

    docs-only:
        name: Docs-Only Fast Path
        needs: [changes]
        if: needs.changes.outputs.docs_only == 'true'
        runs-on: ubuntu-latest
        steps:
            - name: Skip heavy jobs for docs-only change
              run: echo "Docs-only change detected. Rust lint/test/build skipped."

    non-rust:
        name: Non-Rust Fast Path
        needs: [changes]
        if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.rust_changed != 'true'
        runs-on: ubuntu-latest
        steps:
            - name: Skip Rust jobs for non-Rust change scope
              run: echo "No Rust-impacting files changed. Rust lint/test/build skipped."

    docs-quality:
        name: Docs Quality
        needs: [changes]
        if: needs.changes.outputs.docs_changed == 'true' && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full'))
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
              with:
                  fetch-depth: 0

            - name: Markdown lint (changed lines only)
              env:
                  BASE_SHA: ${{ needs.changes.outputs.base_sha }}
                  DOCS_FILES: ${{ needs.changes.outputs.docs_files }}
              run: ./scripts/ci/docs_quality_gate.sh

            - name: Collect added links
              id: collect_links
              shell: bash
              env:
                  BASE_SHA: ${{ needs.changes.outputs.base_sha }}
                  DOCS_FILES: ${{ needs.changes.outputs.docs_files }}
              run: |
                  set -euo pipefail
                  python3 ./scripts/ci/collect_changed_links.py \
                    --base "$BASE_SHA" \
                    --docs-files "$DOCS_FILES" \
                    --output .ci-added-links.txt
                  count=$(wc -l < .ci-added-links.txt | tr -d ' ')
                  echo "count=$count" >> "$GITHUB_OUTPUT"
                  if [ "$count" -gt 0 ]; then
                    echo "Added links queued for check:"
                    cat .ci-added-links.txt
                  else
                    echo "No added links found in changed docs lines."
                  fi

            - name: Link check (offline, added links only)
              if: steps.collect_links.outputs.count != '0'
              uses: lycheeverse/lychee-action@a8c4c7cb88f0c7386610c35eb25108e448569cb0 # v2
              with:
                  fail: true
                  args: >-
                      --offline
                      --no-progress
                      --format detailed
                      .ci-added-links.txt
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Skip link check (no added links)
              if: steps.collect_links.outputs.count == '0'
              run: echo "No added links in changed docs lines. Link check skipped."

    lint-feedback:
        name: Lint Feedback
        if: github.event_name == 'pull_request'
        needs: [changes, lint, lint-all-features, docs-quality]
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: write
            issues: write
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

            - name: Post actionable lint failure summary
              if: always()
              uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
              env:
                  RUST_CHANGED: ${{ needs.changes.outputs.rust_changed }}
                  DOCS_CHANGED: ${{ needs.changes.outputs.docs_changed }}
                  LINT_RESULT: ${{ needs.lint.result }}
                  LINT_DELTA_RESULT: ${{ needs.lint-all-features.result }}
                  DOCS_RESULT: ${{ needs.docs-quality.result }}
              with:
                  script: |
                      const script = require('./.github/workflows/scripts/lint_feedback.js');
                      await script({github, context, core});

    workflow-owner-approval:
        name: Workflow Owner Approval
        needs: [changes]
        if: github.event_name == 'pull_request' && needs.changes.outputs.workflow_changed == 'true'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: read
        steps:
            - name: Checkout repository
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

            - name: Require owner approval for workflow file changes
              uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
              env:
                  WORKFLOW_OWNER_LOGINS: ${{ vars.WORKFLOW_OWNER_LOGINS }}
              with:
                  script: |
                    const script = require('./.github/workflows/scripts/ci_workflow_owner_approval.js');
                    await script({ github, context, core });
    ci-required:
        name: CI Required Gate
        if: always()
        needs: [contracts, windows-installer, changes, lint, lint-all-features, test, build, bench-check, windows-check, docs-only, non-rust, docs-quality, lint-feedback, workflow-owner-approval]
        runs-on: ubuntu-latest
        steps:
            - name: Enforce required status
              shell: bash
              run: |
                  set -euo pipefail

                  if [ "${{ needs.contracts.result }}" != "success" ] || [ "${{ needs.windows-installer.result }}" != "success" ]; then
                    echo "Contracts did not pass."
                    exit 1
                  fi

                  event_name="${{ github.event_name }}"
                  rust_changed="${{ needs.changes.outputs.rust_changed }}"
                  docs_changed="${{ needs.changes.outputs.docs_changed }}"
                  workflow_changed="${{ needs.changes.outputs.workflow_changed }}"
                  docs_result="${{ needs.docs-quality.result }}"
                  workflow_owner_result="${{ needs.workflow-owner-approval.result }}"

                  if [ "${{ needs.changes.outputs.docs_only }}" = "true" ]; then
                    echo "workflow_owner_approval=${workflow_owner_result}"
                    if [ "$event_name" = "pull_request" ] && [ "$workflow_changed" = "true" ] && [ "$workflow_owner_result" != "success" ]; then
                      echo "Workflow files changed but workflow owner approval gate did not pass."
                      exit 1
                    fi
                    if [ "$event_name" != "pull_request" ] && [ "$docs_changed" = "true" ] && [ "$docs_result" != "success" ]; then
                      echo "Docs-only push changed docs, but docs-quality did not pass."
                      exit 1
                    fi
                    echo "Docs-only fast path passed."
                    exit 0
                  fi

                  if [ "$rust_changed" != "true" ]; then
                    echo "rust_changed=false (non-rust fast path)"
                    echo "workflow_owner_approval=${workflow_owner_result}"
                    if [ "$event_name" = "pull_request" ] && [ "$workflow_changed" = "true" ] && [ "$workflow_owner_result" != "success" ]; then
                      echo "Workflow files changed but workflow owner approval gate did not pass."
                      exit 1
                    fi
                    if [ "$event_name" != "pull_request" ] && [ "$docs_changed" = "true" ] && [ "$docs_result" != "success" ]; then
                      echo "Non-rust push changed docs, but docs-quality did not pass."
                      exit 1
                    fi
                    echo "Non-rust fast path passed."
                    exit 0
                  fi

                  lint_result="${{ needs.lint.result }}"
                  lint_strict_delta_result="${{ needs.lint-all-features.result }}"
                  test_result="${{ needs.test.result }}"
                  build_result="${{ needs.build.result }}"
                  windows_check_result="${{ needs.windows-check.result }}"

                  echo "lint=${lint_result}"
                  echo "lint_strict_delta=${lint_strict_delta_result}"
                  echo "test=${test_result}"
                  echo "build=${build_result}"
                  echo "windows_check=${windows_check_result}"
                  echo "docs=${docs_result}"
                  echo "workflow_owner_approval=${workflow_owner_result}"

                  if [ "$event_name" = "pull_request" ] && [ "$workflow_changed" = "true" ] && [ "$workflow_owner_result" != "success" ]; then
                    echo "Workflow files changed but workflow owner approval gate did not pass."
                    exit 1
                  fi

                  if [ "$event_name" = "pull_request" ]; then
                    if [ "$lint_result" != "success" ] || [ "$lint_strict_delta_result" != "success" ] || [ "$test_result" != "success" ] || [ "$build_result" != "success" ] || [ "${{ needs.bench-check.result }}" != "success" ] || [ "$windows_check_result" != "success" ]; then
                      echo "Required PR CI jobs did not pass."
                      exit 1
                    fi
                    echo "PR required checks passed."
                    exit 0
                  fi

                  if [ "$lint_result" != "success" ] || [ "$lint_strict_delta_result" != "success" ] || [ "$test_result" != "success" ] || [ "$build_result" != "success" ] || [ "${{ needs.bench-check.result }}" != "success" ] || [ "$windows_check_result" != "success" ]; then
                    echo "Required push CI jobs did not pass."
                    exit 1
                  fi

                  if [ "$docs_changed" = "true" ] && [ "$docs_result" != "success" ]; then
                    echo "Push changed docs, but docs-quality did not pass."
                    exit 1
                  fi

                  echo "Push required checks passed."
