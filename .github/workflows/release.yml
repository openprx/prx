name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Determine release tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ github.event.inputs.tag }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Verify tag matches Cargo package version
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          package_version="$(
            awk -F'"' '
              /^\[package\]$/ { in_package = 1; next }
              /^\[/ { in_package = 0 }
              in_package && /^version = / { print $2; exit }
            ' Cargo.toml
          )"
          test "$RELEASE_TAG" = "v$package_version"
      - name: Verify installer and toolchain contracts
        run: |
          ./scripts/ci/rust_toolchain_sync_gate.sh
          ./scripts/ci/installer_contract_gate.sh

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            suffix: linux-amd64
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            suffix: linux-arm64
            use_cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            suffix: macos-amd64
            use_cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            suffix: macos-arm64
            use_cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            suffix: windows-amd64
            use_cross: false

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}

      - name: Ensure target is installed
        run: rustup target add ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: >-
          cargo install cross
          --git https://github.com/cross-rs/cross
          --rev 1d07d3f9cc465c435256f1aabc1d18024517891a
          --locked

      - name: Create swap (Linux)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile
          sudo dd if=/dev/zero of=/swapfile bs=1M count=4096
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Install system deps (Linux)
        if: runner.os == 'Linux' && !matrix.use_cross
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev protobuf-compiler

      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install system deps (Windows)
        if: runner.os == 'Windows'
        run: choco install protoc --yes

      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          key: ${{ matrix.target }}-ci

      - name: Build (cross)
        if: matrix.use_cross
        run: cross build --locked --profile ci --bin prx --bin prx-node --target ${{ matrix.target }}

      - name: Build (native)
        if: "!matrix.use_cross"
        env:
          CARGO_BUILD_JOBS: "2"
        run: cargo build --locked --profile ci --bin prx --bin prx-node --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cd target/${{ matrix.target }}/ci
          chmod +x prx prx-node
          tar czf ../../../prx-${{ matrix.suffix }}.tar.gz prx
          tar czf ../../../prx-node-${{ matrix.suffix }}.tar.gz prx-node
          cd ../../..
          for archive in \
            prx-${{ matrix.suffix }}.tar.gz \
            prx-node-${{ matrix.suffix }}.tar.gz
          do
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$archive" > "$archive.sha256"
            else
              shasum -a 256 "$archive" > "$archive.sha256"
            fi
          done

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/ci
          Compress-Archive -Path prx.exe -DestinationPath ../../../prx-${{ matrix.suffix }}.zip
          Compress-Archive -Path prx-node.exe -DestinationPath ../../../prx-node-${{ matrix.suffix }}.zip
          cd ../../..
          $prxArchive = "prx-${{ matrix.suffix }}.zip"
          $nodeArchive = "prx-node-${{ matrix.suffix }}.zip"
          $prxHash = (Get-FileHash $prxArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          $nodeHash = (Get-FileHash $nodeArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$prxHash  $prxArchive" | Set-Content -Encoding ascii "$prxArchive.sha256"
          "$nodeHash  $nodeArchive" | Set-Content -Encoding ascii "$nodeArchive.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prx-${{ matrix.suffix }}
          path: |
            prx-${{ matrix.suffix }}.*
            prx-node-${{ matrix.suffix }}.*
          if-no-files-found: error

  release:
    needs: [validate, build]
    if: success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Stage standalone installers
        shell: bash
        run: |
          set -euo pipefail
          cp install.sh install.ps1 artifacts/
          (
            cd artifacts
            sha256sum install.sh > install.sh.sha256
            sha256sum install.ps1 > install.ps1.sha256
          )
      - name: Verify release asset completeness
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            prx-linux-amd64.tar.gz
            prx-linux-amd64.tar.gz.sha256
            prx-linux-arm64.tar.gz
            prx-linux-arm64.tar.gz.sha256
            prx-macos-amd64.tar.gz
            prx-macos-amd64.tar.gz.sha256
            prx-macos-arm64.tar.gz
            prx-macos-arm64.tar.gz.sha256
            prx-windows-amd64.zip
            prx-windows-amd64.zip.sha256
            prx-node-linux-amd64.tar.gz
            prx-node-linux-amd64.tar.gz.sha256
            prx-node-linux-arm64.tar.gz
            prx-node-linux-arm64.tar.gz.sha256
            prx-node-macos-amd64.tar.gz
            prx-node-macos-amd64.tar.gz.sha256
            prx-node-macos-arm64.tar.gz
            prx-node-macos-arm64.tar.gz.sha256
            prx-node-windows-amd64.zip
            prx-node-windows-amd64.zip.sha256
            install.sh
            install.sh.sha256
            install.ps1
            install.ps1.sha256
          )
          test "$(find artifacts -maxdepth 1 -type f | wc -l)" -eq "${#expected[@]}"
          for asset in "${expected[@]}"; do
            test -s "artifacts/$asset"
          done
      - name: Smoke-test Linux release binary
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p release-smoke
          tar -xzf artifacts/prx-linux-amd64.tar.gz -C release-smoke prx
          test "$(release-smoke/prx --version)" = "prx ${RELEASE_TAG#v}"
      - name: Create or Update Release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          name: PRX ${{ needs.validate.outputs.tag }}
          files: artifacts/*
          body: |
            ## PRX ${{ needs.validate.outputs.tag }}

            Self-evolving AI assistant framework.

            ### prx (AI daemon)
            | Platform | Architecture | File |
            |----------|-------------|------|
            | Linux | x86_64 | `prx-linux-amd64.tar.gz` |
            | Linux | ARM64 | `prx-linux-arm64.tar.gz` |
            | macOS | Intel | `prx-macos-amd64.tar.gz` |
            | macOS | Apple Silicon | `prx-macos-arm64.tar.gz` |
            | Windows | x86_64 | `prx-windows-amd64.zip` |

            ### prx-node (remote node agent)
            | Platform | Architecture | File |
            |----------|-------------|------|
            | Linux | x86_64 | `prx-node-linux-amd64.tar.gz` |
            | Linux | ARM64 | `prx-node-linux-arm64.tar.gz` |
            | macOS | Intel | `prx-node-macos-amd64.tar.gz` |
            | macOS | Apple Silicon | `prx-node-macos-arm64.tar.gz` |
            | Windows | x86_64 | `prx-node-windows-amd64.zip` |

            ### One-click install

            Linux/macOS:

            ```bash
            curl -fsSL https://github.com/openprx/prx/releases/latest/download/install.sh | sh
            ```

            Windows PowerShell:

            ```powershell
            irm https://github.com/openprx/prx/releases/latest/download/install.ps1 | iex
            ```
