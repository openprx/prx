[advisories]
ignore = [
    # bincode v2.0.1 via probe-rs — project considered complete
    "RUSTSEC-2025-0141",
    # pin-utils unmaintained — async-imap transitive (0.11 and 0.12), macro-only crate considered complete
    "RUSTSEC-2026-0441",
]
informational_warnings = ["unmaintained"]
severity_threshold = "low"

[database]
fetch = true
stale = false

[output]
deny = ["unmaintained"]
format = "terminal"
quiet = false
show_tree = true

[yanked]
enabled = true
update_index = true
