[advisories]
ignore = [
    # bincode v1.3.3 via syntect — unmaintained, upstream considers 1.3.3 complete
    "RUSTSEC-2025-0141",
    # pin-utils unmaintained — async-imap transitive (0.11 and 0.12), macro-only crate considered complete
    "RUSTSEC-2026-0441",
    # chrono / chrono-tz unmaintained (2026-11-17), no vulnerability; migration tracked as FU-CHRONO-UNMAINTAINED
    "RUSTSEC-2026-0543",
    "RUSTSEC-2026-0555",
]
informational_warnings = ["unmaintained"]
severity_threshold = "low"

[database]
fetch = true
stale = false

[output]
deny = ["unmaintained"]
format = "terminal"
quiet = false
show_tree = true

[yanked]
enabled = true
update_index = true
