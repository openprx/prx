# FASTCI-02: every test must finish well inside a minute. A test that runs
# longer is reported SLOW after 60 s and killed after one more period.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 1 }
fail-fast = false
status-level = "slow"
final-status-level = "slow"

[profile.ci]
# QA runners have a 4-CPU quota; run at most 4 tests at once so wall-clock
# deadlines inside tests are not starved (QA runs 42018222917, 42055508885).
test-threads = 4
slow-timeout = { period = "60s", terminate-after = 1 }
fail-fast = false
failure-output = "immediate-final"

# PRX-SLOW-01: make the experiments tests fit the standard 60-s budget.
[[profile.ci.overrides]]
filter = 'test(/^skills::lifecycle::tests::propose::experiments::/)'
slow-timeout = { period = "60s", terminate-after = 4 }

# PRX-SLOW-01: 1000 tool iterations exceed 60 s on the QA 4-CPU quota.
[[profile.ci.overrides]]
filter = 'test(=agent_allows_one_thousand_tool_iterations_to_finish)'
slow-timeout = { period = "60s", terminate-after = 4 }

# PTY and child-process end-to-end tests drive a real `prx` binary plus its
# children; give each two of the four slots.
[[profile.ci.overrides]]
filter = 'binary(chat_pty_e2e) | binary(session_worker_stdin_protocol)'
threads-required = 2
